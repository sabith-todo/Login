<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Web</title>

<style>
:root {
    --primary: #1e3a8a;
    --secondary: #22c55e;
    --text-dark: #0f172a;
    --text-light: #ffffff;
    --bg-overlay: rgba(15, 23, 42, 0.75);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: 
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url(img/chat.png);
    background-size: cover;
    background-position: center;
}

/* ================= HEADER ================= */
.main-header {
    height: 80px;
    padding: 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.main-header h2 {
    font-size: 24px;
    color: var(--primary);
    font-weight: 700;
}

.main-header nav {
    display: flex;
    align-items: center;
    gap: 24px;
}

.main-header nav a {
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-dark);
    transition: color 0.3s;
}

.main-header nav a:hover {
    color: var(--primary);
}

/* Sign Up button */
.signup-btn {
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
}

.signup-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(30,58,138,0.3);
}

/* ================= HERO ================= */
.hero {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero-content {
    max-width: 720px;
    padding: 20px;
}

.hero-content h1 {
    font-size: 48px;
    font-weight: 700;
    color: var(--text-light);
    margin-bottom: 18px;
}

.hero-content p {
    font-size: 18px;
    color: #e5e7eb;
    line-height: 1.7;
    margin-bottom: 35px;
}

/* CTA */
.hero-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.btn-primary {
    padding: 14px 34px;
    background: var(--secondary);
    color: #052e16;
    border-radius: 10px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(34,197,94,0.4);
}
</style>
</head>

<body>

<header class="main-header">
    <h2>Todo Web</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="create.html" class="signup-btn">Sign Up</a>
    </nav>
</header>

<main class="hero">
    <div class="hero-content">
        <h1>Organize Your Tasks Effortlessly</h1>
        <p>
            A modern task management platform that helps you plan, track,
            and complete your work efficiently — anytime, anywhere.
        </p>

        <div class="hero-actions">
            <a href="login.html" class="btn-primary">Get Started</a>
        </div>
    </div>
</main>

</body>
</html>
