<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Web - Task Management Platform</title>
    <meta name="description" content="A modern task management platform that helps you plan, track, and complete your work efficiently.">
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .landing-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .landing-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .landing-nav a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.15s ease;
        }

        .landing-nav a:hover {
            color: var(--text-main);
        }

        .landing-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 680px;
            padding: 60px 16px;
            margin: auto;
        }

        .landing-hero h1 {
            font-size: 44px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .landing-hero p {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .hero-cta-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        @media (max-width: 640px) {
            .landing-hero h1 {
                font-size: 32px;
            }
            .landing-hero p {
                font-size: 15px;
            }
            .hero-cta-group {
                flex-direction: column;
                width: 100%;
            }
            .hero-cta-group .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="landing-header">
        <a href="index.html" class="landing-logo">Todo Web</a>
        <nav class="landing-nav" aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="create.html" class="btn btn-primary" style="height: 36px; padding: 0 16px; font-size: 13px;">Sign Up</a>
        </nav>
    </header>

    <main class="landing-hero">
        <h1>Organize and Track Your Projects</h1>
        <p>
            A lightweight, responsive web portal to manage project workflows,
            authenticate with role-based demo accounts, and explore project repositories.
        </p>

        <div class="hero-cta-group">
            <a href="login.html" class="btn btn-primary" style="padding: 0 24px;">Sign in</a>
            <a href="create.html" class="btn btn-secondary" style="padding: 0 24px;">Create account</a>
        </div>
    </main>

    <footer class="auth-footer" style="margin-top: auto; padding-top: 24px;">
        <p>&copy; 2026 Todo Web • Created by Sabith</p>
    </footer>

</body>
</html>
