<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple Login Page</title>
    <meta name="description" content="A clean, accessible, and responsive login interface built with semantic HTML and modern CSS.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth-wrapper">
    <!-- Brand / Header -->
    <header class="auth-brand">
        <div class="brand-badge" aria-hidden="true">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Please enter your credentials to access your account</p>
    </header>

    <!-- Auth Card -->
    <section class="auth-card" aria-label="Login form container">
        <!-- Live status feedback banner -->
        <div id="statusAlert" class="alert-banner" role="alert" aria-live="polite"></div>

        <form id="loginForm" class="auth-form" onsubmit="return handleLogin(event)" novalidate>
            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-container">
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        required 
                        autocomplete="username" 
                        autofocus>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-container">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="name@company.com" 
                        required 
                        autocomplete="email">
                </div>
            </div>

            <!-- Password with Show/Hide Toggle -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Minimum 8 characters" 
                        minlength="8" 
                        required 
                        autocomplete="current-password">
                    <button 
                        type="button" 
                        id="togglePasswordBtn" 
                        class="password-toggle-btn" 
                        aria-label="Show password" 
                        title="Show password" 
                        onclick="togglePasswordVisibility()">
                        <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Role Selection -->
            <div class="form-group">
                <label for="role">Account role</label>
                <select id="role" name="role" required>
                    <option value="">Select your role</option>
                    <option value="admin">Admin</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-options-row">
                <label class="checkbox-label" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="forgot.html" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
                <button type="reset" class="btn btn-secondary" onclick="resetFormState()">Clear</button>
            </div>
        </form>

        <!-- Demo Credentials Helper -->
        <aside class="demo-credentials-box" aria-label="Demo credentials">
            <p class="demo-credentials-title">Demo Credentials</p>
            <div class="demo-credentials-list">
                <div class="demo-cred-row">
                    <span>Admin:</span>
                    <span><code>admin</code> / <code>admin123</code> (Admin)</span>
                </div>
                <div class="demo-cred-row">
                    <span>Student:</span>
                    <span><code>student</code> / <code>student123</code> (Student)</span>
                </div>
            </div>
        </aside>
    </section>

    <!-- Footer Links -->
    <footer class="auth-footer">
        <p>Don't have an account? <a href="create.html">Create an account</a></p>
        <nav class="footer-nav" aria-label="Quick links">
            <a href="index.html">Home</a>
            <span>•</span>
            <a href="forgot.html">Reset Password</a>
        </nav>
    </footer>
</main>

<script>
function showAlert(message, type) {
    const alertEl = document.getElementById("statusAlert");
    alertEl.textContent = message;
    alertEl.className = "alert-banner " + type;
}

function resetFormState() {
    const alertEl = document.getElementById("statusAlert");
    alertEl.className = "alert-banner";
    alertEl.textContent = "";
}

function togglePasswordVisibility() {
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePasswordBtn");
    const eyeIcon = document.getElementById("eyeIcon");
    
    if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.setAttribute("aria-label", "Hide password");
        toggleBtn.title = "Hide password";
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
        `;
    } else {
        passInput.type = "password";
        toggleBtn.setAttribute("aria-label", "Show password");
        toggleBtn.title = "Show password";
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        `;
    }
}

function handleLogin(event) {
    if (event) event.preventDefault();
    
    const user = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    if (!user || !email || !pass || !role) {
        showAlert("Please fill in all required fields.", "error");
        return false;
    }

    // Demo credentials verification
    if (user === "admin" && pass === "admin123" && role === "admin") {
        showAlert("Admin authentication successful. Redirecting to projects...", "success");
        setTimeout(function() {
            window.location.href = "container.html";
        }, 800);
        return false;
    }

    if (user === "student" && pass === "student123" && role === "student") {
        showAlert("Student authentication successful. Redirecting to projects...", "success");
        setTimeout(function() {
            window.location.href = "container.html";
        }, 800);
        return false;
    }

    showAlert("Invalid credentials or mismatched role. Check demo credentials below.", "error");
    return false;
}
</script>

</body>
</html>
